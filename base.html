<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Business Blueprint Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg app-navbar px-4 shadow-sm">
    <div class="container-fluid px-0">
      <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" href="{{ url_for('generate_page') if session.get('uid') else url_for('login') }}">
        <span>🚀</span> Startup Business Blueprint
      </a>
      {% if session.get('uid') %}
        <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link text-white-50 px-2" href="{{ url_for('generate_page') }}">✨ Generate</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white-50 px-2" href="{{ url_for('history') }}">📁 History</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white-50 px-2" href="{{ url_for('overview') }}">📋 Overview</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white-50 px-2" href="{{ url_for('dashboard') }}">📊 Dashboard</a>
            </li>
            <li class="nav-item ms-lg-3 d-flex align-items-center gap-2 mt-2 mt-lg-0">
              <span class="badge bg-light text-dark px-3 py-2 fw-medium">👤 {{ session.get('name') }}</span>
              <a class="btn btn-sm btn-outline-light px-3" href="{{ url_for('logout') }}">Logout</a>
            </li>
          </ul>
        </div>
      {% endif %}
    </div>
  </nav>

  <main class="container py-4">
    {% for m in get_flashed_messages() %}
      <div class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
        {{ m }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
